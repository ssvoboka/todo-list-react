<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2e9" />
    <meta
      name="description"
      content="Простой список повседневных задач. Добавляйте, отмечайте выполненное и сохраняйте задачи в своём браузере."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/manrope-cyrillic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Мои задачи — список дел</title>
    <script>
      // Применяем тему до CSS и React, чтобы избежать вспышки при загрузке.
      ;(() => {
        let theme
        try {
          theme = localStorage.getItem('todo-list.theme')
        } catch {
          /* Используем системную тему. */
        }
        if (theme !== 'light' && theme !== 'dark')
          theme = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#191e1a' : '#f3f2e9'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
